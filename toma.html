<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE GHOST OF EUROPE: v10.2</title>
    <style>
        body {
            background-color: #050505;
            margin: 0;
            /* THE FIX: Make body taller than screen to allow browser UI hiding */
            min-height: 120vh; 
            overflow-y: auto; 
            touch-action: pan-y; /* Allow vertical swipe */
            font-family: 'Courier New', Courier, monospace;
        }

        /* NEW WRAPPER: Keeps the game centered and pinned while body scrolls behind it */
        #game-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }
        
        canvas {
            border: 4px solid #333;
            background-color: #000;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            image-rendering: pixelated;
            cursor: crosshair;
            max-width: 100%;
            max-height: 80vh; /* Leave room for controls */
            display: block;
        }

        .ui-overlay {
            position: absolute;
            top: 10px;
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none;
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
        }
        .score { color: #f1c40f; font-weight: bold; font-size: 20px; }
        .chapter { color: #bdc3c7; font-weight: bold; text-transform: uppercase; font-size: 16px; }

        /* MOBILE CONTROLS */
        #mobileControls {
            display: none;
            position: absolute;
            bottom: 20px;
            width: 100%;
            height: 140px;
            pointer-events: none;
            z-index: 20;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
        }

        .dpad {
            position: relative;
            width: 140px;
            height: 140px;
            pointer-events: auto;
        }

        .d-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            width: 45px;
            height: 45px;
            backdrop-filter: blur(4px);
        }
        .d-btn:active { background: rgba(255, 255, 255, 0.5); }
        .d-up { top: 0; left: 48px; }
        .d-down { bottom: 0; left: 48px; }
        .d-left { top: 48px; left: 0; }
        .d-right { top: 48px; right: 0; }

        .action-btn {
            pointer-events: auto;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(231, 76, 60, 0.4);
            border: 4px solid rgba(231, 76, 60, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
            margin-top: 25px;
            backdrop-filter: blur(4px);
        }
        .action-btn:active { background: rgba(231, 76, 60, 0.9); transform: scale(0.95); }

        /* Show controls on small screens or touch devices */
        @media (max-width: 1024px), (pointer: coarse) {
            #mobileControls { display: flex; }
        }
    </style>
</head>
<body>

<div id="game-layer">
    <div class="ui-overlay">
        <div class="chapter" id="chapterDisplay">WAITING...</div>
        <div class="score" id="scoreDisplay">REP: 0</div>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div id="mobileControls">
        <div class="dpad">
            <div class="d-btn d-up" data-key="ArrowUp"></div>
            <div class="d-btn d-down" data-key="ArrowDown"></div>
            <div class="d-btn d-left" data-key="ArrowLeft"></div>
            <div class="d-btn d-right" data-key="ArrowRight"></div>
        </div>
        <div class="action-btn" id="btnA" data-key="Space">A</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreDisplay');
    const chapEl = document.getElementById('chapterDisplay');
    const controlsDiv = document.getElementById('mobileControls');

    // --- GAME STATE ---
    const STATE = {
        CHALLENGE: -1,
        WARNING: 0, MENU: 1,
        
        CH1_INTRO: 5, CH1_GAME: 6, CH1_JAIL: 7, CH1_HISTORY: 8,
        CH2_INTRO: 10, CH2_GAME: 11, CH2_WIN: 115, CH2_HISTORY: 12,
        CH3_INTRO: 13, CH3_GAME: 14, CH3_WIN: 142, CH3_HISTORY: 145,
        CH4_INTRO: 15, CH4_GAME: 16, CH4_WIN: 17, CH4_HISTORY: 18,
        CH5_INTRO: 20, CH5_GAME: 21, CH5_WIN: 215, CH5_HISTORY: 22,
        CH6_INTRO: 30, CH6_GAME: 31, CH6_JAIL: 32, CH6_HISTORY: 33,
        CH7_INTRO: 35, CH7_GAME: 36, CH7_WIN: 37, CH7_HISTORY: 38,
        
        FINAL_SCORE: 40
    };

    let currentState = STATE.WARNING;
    let score = 0;
    let levelStartScore = 0;
    let challengerScore = 0;
    
    // FUNNY QUOTES
    const QUOTES = [
        "Mamma Mia! Not today!", "Enjoy the risotto in jail!", "Ciao Bello! You are busted!",
        "My grandmother runs faster!", "No pizza for you tonight!", "The Carabinieri send regards!",
        "You run like a turtle in polenta!", "Did you forget your glasses?", "Back to the cell, tough guy!",
        "Even the Pope is disappointed!", "My cat catches mice faster!", "Too much spaghetti for lunch?",
        "Forget the bedsheets, use the door!", "Not in my shift, amico!", "Go directly to jail, do not pass Go!",
        "You call that an escape?", "Pasta la vista, baby!", "You are grounded, mister!"
    ];
    let currentQuote = "";

    // --- INITIALIZATION ---
    window.onload = function() {
        // Auto-scroll attempt to hide address bar
        window.scrollTo(0, 1);
        
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.has('score')) {
            challengerScore = parseInt(urlParams.get('score')) || 0;
            currentState = STATE.CHALLENGE;
        } else {
            currentState = STATE.WARNING;
        }
        loop(); 
    };

    // --- INPUT ---
    const keys = {};
    const keysPressed = {}; 

    window.addEventListener('keydown', e => {
        if(["Space","Enter","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) e.preventDefault();
        keys[e.code] = true;
    });
    window.addEventListener('keyup', e => {
        keys[e.code] = false;
        keysPressed[e.code] = false; 
    });

    const touchButtons = document.querySelectorAll('.d-btn, .action-btn');
    touchButtons.forEach(btn => {
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const key = btn.getAttribute('data-key');
            keys[key] = true;
            if(key === 'Space') keys['Enter'] = true; 
        });
        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            const key = btn.getAttribute('data-key');
            keys[key] = false;
            keysPressed[key] = false;
            if(key === 'Space') { keys['Enter'] = false; keysPressed['Enter'] = false; }
        });
    });

    function isKeyTapped(code) {
        if (keys[code] && !keysPressed[code]) {
            keysPressed[code] = true;
            return true;
        }
        return false;
    }

    function checkMobile() {
        return getComputedStyle(controlsDiv).display !== 'none';
    }

    function txt(desktop, mobile) {
        return checkMobile() ? mobile : desktop;
    }

    function handleScreenClick(clientX, clientY) {
        if(currentState === STATE.FINAL_SCORE) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;
            if(x > 250 && x < 550 && y > 300 && y < 350) copyLink();
        }
    }
    // Listen on window to catch clicks passing through overlay
    window.addEventListener('mousedown', e => handleScreenClick(e.clientX, e.clientY));
    window.addEventListener('touchstart', e => {
        const touch = e.touches[0];
        handleScreenClick(touch.clientX, touch.clientY);
    });

    function resetGame() {
        score = 0; levelStartScore = 0;
        c0 = { x: 400, y: 225, items: [], cops: [], timer: 0, lives: 2, bustedState: 0, bustedTimer: 0 };
        c1 = { playerX: 50, wallHeight: 0, isClimbing: false, guardLooking: false, guardTimer: 0, nextSwitch: 100, bustedTimer: 0, soccerTimer: 0 };
        c12 = { lane: 1, carY: 350, obstacles: [], timer: 0, distance: 0, bustedTimer: 0 };
        c15 = { x: 400, y: 400, cookState: 0, cookTimer: 0, eggsCollected: 0, eggLocs: [], bustedTimer: 0 };
        c2 = { sawProgress: 0, noise: 0, isSawing: false, guardX: 0, guardDir: 1, pasteTimer: 0, pasteDelay: 0, bustedTimer: 0 };
        c3 = { carY: 225, obstacles: [], distance: 0, speed: 8, roadOffset: 0, crashed: false, crashTimer: 0 };
        c4 = { descent: 0, playerY: 50, lasers: [], lightY: 500, lightDir: -1, bustedTimer: 0, bustedReason: "" };
    }

    function copyLink() {
        const url = "https://valentinopacifici.com/toma.html?score=" + Math.floor(score);
        navigator.clipboard.writeText(url);
        alert("Challenge Link copied!\n" + url);
    }

    function getQuote() { return QUOTES[Math.floor(Math.random() * QUOTES.length)]; }

    // --- VARIABLES ---
    let c0 = { x: 400, y: 225, items: [], cops: [], timer: 0, lives: 2, bustedState: 0, bustedTimer: 0 };
    let c1 = { playerX: 50, wallHeight: 0, isClimbing: false, guardLooking: false, guardTimer: 0, nextSwitch: 100, bustedTimer: 0, soccerTimer: 0 };
    let c12 = { lane: 1, carY: 350, obstacles: [], timer: 0, distance: 0, bustedTimer: 0 };
    let c15 = { x: 400, y: 400, cookState: 0, cookTimer: 0, eggsCollected: 0, eggLocs: [], bustedTimer: 0 };
    let c2 = { sawProgress: 0, noise: 0, isSawing: false, guardX: 0, guardDir: 1, pasteTimer: 0, pasteDelay: 0, bustedTimer: 0 };
    let c3 = { carY: 225, obstacles: [], distance: 0, speed: 8, roadOffset: 0, crashed: false, crashTimer: 0 };
    let c4 = { descent: 0, playerY: 50, lasers: [], lightY: 500, lightDir: -1, bustedTimer: 0, bustedReason: "" };

    // --- DRAWING HELPERS ---
    function drawToma(x, y, scale = 1, animFrame = 0, suit = false, hanging = false) {
        ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
        // Bobbing Anim
        if(animFrame > 0 && !hanging) ctx.translate(0, (Math.floor(animFrame/5)%2===0) ? -2 : 0);

        ctx.fillStyle = suit ? '#2c3e50' : '#95a5a6'; ctx.fillRect(0, 0, 20, 40);
        if(!suit) { ctx.fillStyle = '#2c3e50'; for(let i=10; i<40; i+=10) ctx.fillRect(0, i, 20, 4); } 
        else { ctx.fillStyle = '#c0392b'; ctx.fillRect(8, 5, 4, 15); }
        ctx.fillStyle = '#eebb99'; ctx.fillRect(2, -12, 16, 12);
        ctx.fillStyle = '#222'; ctx.fillRect(2, -14, 16, 4);
        ctx.fillStyle = suit ? '#2c3e50' : '#7f8c8d';
        if(hanging) {
            ctx.fillRect(2, 40, 6, 15); ctx.fillRect(12, 40, 6, 15);
            ctx.fillStyle = '#eebb99'; ctx.fillRect(-2, -5, 4, 15); ctx.fillRect(18, -5, 4, 15);
        } else {
            if (animFrame > 0) { // Fast legs
                if (Math.floor(animFrame / 4) % 2 === 0) { ctx.fillRect(0, 38, 8, 12); ctx.fillRect(14, 38, 4, 8); } 
                else { ctx.fillRect(4, 38, 4, 8); ctx.fillRect(12, 38, 8, 12); }
            } else {
                ctx.fillRect(2, 38, 6, 12); ctx.fillRect(12, 38, 6, 12);
            }
        }
        ctx.restore();
    }

    function drawGuard(x, y, lookingLeft, hasCone = true, animFrame = 0) {
        ctx.save(); ctx.translate(x, y);
        if(animFrame > 0) ctx.translate(0, (Math.floor(animFrame/5)%2===0) ? -2 : 0);

        if (hasCone) {
            ctx.fillStyle = 'rgba(231, 76, 60, 0.4)'; ctx.beginPath();
            if (lookingLeft) { ctx.moveTo(0, -10); ctx.lineTo(-250, -100); ctx.lineTo(-250, 150); } 
            else { ctx.moveTo(24, -10); ctx.lineTo(250, -100); ctx.lineTo(250, 150); }
            ctx.fill();
        }
        ctx.fillStyle = '#192a56'; ctx.fillRect(0, 0, 24, 45);
        ctx.fillStyle = '#eebb99'; ctx.fillRect(4, -12, 16, 12);
        ctx.fillStyle = '#192a56'; ctx.fillRect(2, -16, 20, 6);
        ctx.fillStyle = '#e74c3c'; 
        if (lookingLeft) ctx.fillRect(4, -8, 4, 4); else ctx.fillRect(16, -8, 4, 4);
        
        ctx.fillStyle = '#192a56';
        if (animFrame > 0) {
             if (Math.floor(animFrame / 6) % 2 === 0) { ctx.fillRect(0, 42, 8, 12); ctx.fillRect(16, 42, 4, 8); } 
             else { ctx.fillRect(4, 42, 4, 8); ctx.fillRect(14, 42, 8, 12); }
        } else {
            ctx.fillRect(2, 45, 8, 10); ctx.fillRect(14, 45, 8, 10);
        }
        ctx.restore();
    }

    // --- MAIN LOOP ---
    function loop() {
        ctx.clearRect(0, 0, 800, 450);
        scoreEl.innerText = "REP: " + Math.floor(score);

        if(isKeyTapped('r') || isKeyTapped('R')) {
            if(currentState === STATE.CH1_GAME) currentState = STATE.CH1_HISTORY;
            else if(currentState === STATE.CH2_GAME) currentState = STATE.CH2_WIN;
            else if(currentState === STATE.CH3_GAME) currentState = STATE.CH3_WIN;
            else if(currentState === STATE.CH4_GAME) currentState = STATE.CH4_WIN;
            else if(currentState === STATE.CH5_GAME) currentState = STATE.CH5_WIN;
            else if(currentState === STATE.CH6_GAME) currentState = STATE.CH6_HISTORY;
            else if(currentState === STATE.CH7_GAME) currentState = STATE.CH7_WIN;
        }

        switch (currentState) {
            case STATE.CHALLENGE: screenChallenge(); break;
            case STATE.WARNING: screenWarning(); break;
            case STATE.MENU: screenMenu(); break;
            
            case STATE.CH1_INTRO: screenStory("CHAPTER 1: THE BROKER", "Before prison...", "Collect Cash (Green). Avoid Police.", "Get rich before the raid.", "2 LIVES ONLY."); break;
            case STATE.CH1_GAME: playBroker(); break;
            case STATE.CH1_JAIL: screenJail("TERNI PRISON", "2009", "MAX SECURITY WING"); break;
            case STATE.CH1_HISTORY: screenHistory("THE REALITY: 2008", "Taulant Toma was not a street dealer.", "He was a high-level logistics broker for the", "Italian Mafia, moving tons of cocaine.", "He was eventually tracked and captured."); break;

            case STATE.CH2_INTRO: screenStory("CHAPTER 2: TERNI, 2009", "The Opportunity", txt("Guard looks away? RUN (Arrows).", "Guard looks away? USE D-PAD."), txt("At the wall: CLIMB (Tap UP ARROW).", "At the wall: CLIMB (Tap D-PAD UP)."), ""); break;
            case STATE.CH2_GAME: playTerni(); break;
            case STATE.CH2_WIN: screenStory("SUCCESS!", "Wall Scaled", "You vanished into the woods", "while the crowd cheered for the goal.", ""); break; 
            case STATE.CH2_HISTORY: screenHistory("THE REALITY: TERNI 2009", "During a prison soccer match,", "Toma waited for the guards to watch a goal.", "He scaled the perimeter wall in seconds", "and vanished into the woods."); break;

            case STATE.CH3_INTRO: screenStory("CHAPTER 3: THE FUGITIVE", "On The Run (2009-2013)", "Move between Germany & Belgium.", txt("LEFT/RIGHT to switch lanes.", "D-PAD LEFT/RIGHT to switch."), "Collect Phones. Avoid Interpol.", ""); break;
            case STATE.CH3_GAME: playFugitive(); break;
            case STATE.CH3_WIN: screenStory("SUCCESS!", "Network Rebuilt", "You evaded the dragnet for 3 years.", "But your luck is running out...", ""); break;
            case STATE.CH3_HISTORY: screenHistory("THE REALITY: THE GHOST", "For 3 years, Toma lived as a fugitive.", "He moved between Germany and Belgium,", "re-establishing his drug logistics empire", "before being caught and sent to Parma."); break;

            case STATE.CH4_INTRO: screenStory("CHAPTER 4: THE CANTEEN", "Bonus Level: The Heist", "Steal Eggs for Extra REP.", "Cook Facing UP = Safe.", "Cook Facing DOWN = FREEZE.", "Collect 5 Eggs."); break;
            case STATE.CH4_GAME: playCanteen(); break;
            case STATE.CH4_WIN: screenStory("SUCCESS!", "Ingredients Acquired", "You have enough egg whites.", "Now you can make the chemical paste", "to hide your saw cuts."); break;
            case STATE.CH4_HISTORY: screenHistory("THE REALITY: THE PREP", "In Parma, Toma needed to cut iron bars.", "To hide the cuts from daily inspection,", "he mixed egg whites with dust to create", "a paste that looked exactly like rust."); break;
            
            case STATE.CH5_INTRO: screenStory("CHAPTER 5: PARMA, 2013", "The Sawing", txt("Hold SPACE to saw.", "Hold A to saw."), txt("Release to prepare Paste.", "Release A to Paste."), "NEW: There is a 1-second delay!", "Don't get caught."); break;
            case STATE.CH5_GAME: playParma(); break;
            case STATE.CH5_WIN: screenStory("SUCCESS!", "The Bars Are Cut", "You applied the fake rust.", "The guards noticed nothing.", "Tonight, you leave."); break;
            case STATE.CH5_HISTORY: screenHistory("THE REALITY: PARMA 2013", "On a rainy night in December,", "Toma removed the bars he had sawed", "over weeks. He descended using bedsheets", "and met armed accomplices outside."); break;
            
            case STATE.CH6_INTRO: screenStory("CHAPTER 6: THE GETAWAY", "Belgium Border Run", txt("Drive fast (Arrows).", "Drive fast (D-Pad)."), "Avoid Police.", "One crash ends it.", ""); break;
            case STATE.CH6_GAME: playDriving(); break;
            case STATE.CH6_JAIL: screenJail("OPERA PRISON", "2025", "41-bis HARD REGIME"); break;
            case STATE.CH6_HISTORY: screenHistory("THE REALITY: THE MANHUNT", "Toma remained a ghost for 8 months.", "He was eventually cornered by Special Forces", "in Liège, Belgium. He did not fight back.", "He was returned to Italy."); break;
            
            case STATE.CH7_INTRO: screenStory("CHAPTER 7: OPERA, 2025", "The Impossible Escape", "You sawed the bars again.", "Now, the Laser Wall.", txt("Hold DOWN to Slide. UP to Brake.", "D-PAD DOWN Slide. UP Brake."), "Don't touch Lasers. Don't move in Light."); break;
            case STATE.CH7_GAME: playOpera(); break;
            case STATE.CH7_WIN: screenStory("SUCCESS!", "LEGEND STATUS", "You crossed the perimeter.", "The Audi RS6 is waiting.", "You are gone."); break;
            case STATE.CH7_HISTORY: screenHistory("THE REALITY: DEC 7, 2025", "Toma escaped the 'inescapable' Opera prison.", "He used his signature sawing technique.", "Police suspect a drone delivered the tools", "and external clans hacked the sensors."); break;

            case STATE.FINAL_SCORE: screenFinal(); break;
        }
        requestAnimationFrame(loop);
    }

    // --- SCENES ---
    function screenChallenge() {
        chapEl.innerText = "CHALLENGE RECEIVED";
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,800,450);
        ctx.textAlign = 'center'; ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 32px Courier New';
        ctx.fillText("YOUR FRIEND SCORED: " + challengerScore, 400, 150);
        ctx.fillStyle = '#888'; ctx.font = '16px Courier New';
        ctx.fillText("(Unless they tinkered with the link...)", 400, 180);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Courier New';
        ctx.fillText("Show that you can beat them!", 400, 250);
        ctx.fillStyle = '#2ecc71'; ctx.font = 'bold 40px Courier New';
        ctx.fillText("ANDIAMO!", 400, 320);
        ctx.fillStyle = '#f1c40f'; ctx.font = '20px Courier New';
        if (Math.floor(Date.now() / 500) % 2 === 0) ctx.fillText(txt("[ PRESS ENTER TO ACCEPT ]", "[ TAP BUTTON A ]"), 400, 400);
        if (isKeyTapped('Enter')) { resetGame(); currentState = STATE.WARNING; }
    }

    function screenWarning() {
        chapEl.innerText = "WARNING";
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,800,450);
        ctx.textAlign = 'center'; ctx.fillStyle = 'red'; ctx.font = 'bold 30px Courier New';
        ctx.fillText("BREAKING NEWS: DEC 7, 2025", 400, 100);
        ctx.fillStyle = '#eee'; ctx.font = '16px Courier New';
        ctx.fillText("Today, Taulant Toma escaped prison for the 4th time.", 400, 140);
        ctx.fillText("He escaped the ruthless '41-bis' hard prison regime.", 400, 170);
        ctx.fillText("He is now a legend of the European underworld.", 400, 200);
        ctx.fillStyle = '#888'; ctx.fillText("This game was vibe-coded today based on these real events.", 400, 280);
        ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 18px Courier New'; 
        ctx.fillText("DO NOT SPEND YOUR LIFE TRYING TO ESCAPE PRISON.", 400, 330);
        ctx.fillStyle = '#fff'; ctx.fillText("DO NOT BE LIKE TOMA.", 400, 360);
        ctx.fillStyle = '#f1c40f'; ctx.font = '20px Courier New';
        if (Math.floor(Date.now() / 500) % 2 === 0) ctx.fillText(txt("[ PRESS ENTER TO ACKNOWLEDGE ]", "[ TAP BUTTON A ]"), 400, 410);
        if (isKeyTapped('Enter')) setTimeout(() => currentState = STATE.MENU, 300);
    }

    function screenMenu() {
        chapEl.innerText = "MENU";
        ctx.fillStyle = '#111'; ctx.fillRect(0,0,800,450);
        ctx.fillStyle = '#bdc3c7'; ctx.font = 'bold 50px Courier New'; ctx.textAlign = 'center';
        ctx.fillText("THE GHOST", 400, 140); ctx.font = '30px Courier New'; ctx.fillText("OF EUROPE", 400, 180);
        ctx.fillStyle = '#e67e22'; ctx.font = 'bold 20px Courier New';
        ctx.fillText("THE NEW LEGEND OF THE UNDERWORLD", 400, 230);
        ctx.fillStyle = '#f1c40f'; ctx.font = '20px Courier New'; ctx.fillText(txt("[ PRESS ENTER TO START ]", "[ TAP BUTTON A ]"), 400, 350);
        if (isKeyTapped('Enter')) setTimeout(() => currentState = STATE.CH1_INTRO, 300);
    }

    function screenStory(title, sub, l1, l2, l3, l4) {
        chapEl.innerText = "BRIEFING";
        ctx.fillStyle = '#111'; ctx.fillRect(0,0,800,450); ctx.textAlign = 'center';
        ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 32px Courier New'; ctx.fillText(title, 400, 80);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Courier New'; ctx.fillText(sub, 400, 130);
        ctx.fillStyle = '#aaa'; ctx.font = '18px Courier New';
        ctx.fillText(l1, 400, 200); ctx.fillText(l2, 400, 230); ctx.fillText(l3, 400, 260); if(l4) ctx.fillText(l4, 400, 290);
        ctx.fillStyle = '#f1c40f'; ctx.font = '16px Courier New'; ctx.fillText(txt("[ PRESS ENTER ]", "[ TAP BUTTON A ]"), 400, 400);
        if (isKeyTapped('Enter')) {
            setTimeout(() => {
                if(currentState === STATE.CH1_INTRO) { levelStartScore = score; currentState = STATE.CH1_GAME; }
                if(currentState === STATE.CH2_INTRO) { levelStartScore = score; currentState = STATE.CH2_GAME; }
                if(currentState === STATE.CH2_WIN) currentState = STATE.CH2_HISTORY;
                if(currentState === STATE.CH3_INTRO) { levelStartScore = score; currentState = STATE.CH3_GAME; }
                if(currentState === STATE.CH3_WIN) currentState = STATE.CH3_HISTORY;
                if(currentState === STATE.CH4_INTRO) { 
                    levelStartScore = score;
                    c15.eggLocs = []; for(let i=0; i<8; i++) c15.eggLocs.push({x: Math.random()*700+50, y: Math.random()*200+150, taken: false});
                    c15.eggsCollected = 0; c15.bustedTimer = 0; currentState = STATE.CH4_GAME; 
                }
                if(currentState === STATE.CH4_WIN) currentState = STATE.CH4_HISTORY;
                if(currentState === STATE.CH5_INTRO) { levelStartScore = score; currentState = STATE.CH5_GAME; }
                if(currentState === STATE.CH5_WIN) currentState = STATE.CH5_HISTORY;
                if(currentState === STATE.CH6_INTRO) { levelStartScore = score; currentState = STATE.CH6_GAME; }
                if(currentState === STATE.CH7_INTRO) {

    // 3. FUGITIVE

        const lanes = [250, 400, 550]; if (isKeyTapped('ArrowLeft') && c12.lane > 0) c12.lane--; if (isKeyTapped('ArrowRight') && c12.lane < 2) c12.lane++; ctx.fillStyle = '#555'; ctx.fillRect(200, 0, 400, 450); ctx.fillStyle = '#fff'; for(let i=0; i<450; i+=60) { let y = (i + c12.timer * 8) % 450; ctx.fillRect(325, y, 5, 30); ctx.fillRect(475, y, 5, 30); } let px = lanes[c12.lane]; ctx.fillStyle = '#3498db'; ctx.fillRect(px - 20, c12.carY, 40, 60); c12.timer++; if (c12.timer % 40 === 0) { let l = Math.floor(Math.random() * 3); let type = Math.random() > 0.3 ? 'cop' : 'phone'; c12.obstacles.push({ lane: l, y: -50, type: type }); } for (let i = c12.obstacles.length - 1; i >= 0; i--) { let o = c12.obstacles[i]; o.y += 8; let ox = lanes[o.lane]; if(o.type === 'cop') { ctx.fillStyle = '#2c3e50'; ctx.fillRect(ox - 20, o.y, 40, 60); ctx.fillStyle = (Date.now()%200<100) ? 'red' : 'blue'; ctx.fillRect(ox-10, o.y+10, 20, 10); } else { ctx.fillStyle = '#2ecc71'; ctx.fillRect(ox - 10, o.y, 20, 30); } if (o.y > 300 && o.y < 410 && c12.lane === o.lane) { if(o.type === 'cop') { c12.bustedTimer = 60; score -= 200; } else { score += 200; c12.obstacles.splice(i, 1); } } } c12.distance += 2; ctx.fillStyle = '#fff'; ctx.font = '20px Courier New'; ctx.fillText("KM: " + c12.distance, 50, 50); if (c12.distance > 2000) currentState = STATE.CH3_WIN;

    // 4. CANTEEN
    function playCanteen() {
        chapEl.innerText = "CH 4: EGGS (" + c15.eggsCollected + "/5)";
        if (c15.bustedTimer > 0) { ctx.fillStyle = 'rgba(231, 76, 60, 0.9)'; ctx.fillRect(0,0,800,450); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 40px Courier New'; ctx.fillText("COOK SAW YOU!", 400, 150); ctx.fillStyle = 'yellow'; ctx.font = 'italic 25px Courier New'; ctx.fillText('"' + currentQuote + '"', 400, 200); ctx.fillStyle = '#fff'; ctx.font = '20px Courier New'; ctx.fillText("REP LOST: -200", 400, 250); c15.bustedTimer--; if(c15.bustedTimer <= 0) { 
            c15.x = 400; c15.y = 400; c15.eggsCollected = 0; c15.eggLocs.forEach(e => e.taken = false); c15.cookState = 0; c15.cookTimer = 0; 
            score = levelStartScore - 200; // SNAPSHOT RESET
        } return; }
        ctx.fillStyle = '#d35400'; ctx.fillRect(0,0,800,450); for(let i=0; i<800; i+=50) for(let j=0; j<450; j+=50) if((i+j)%100 === 0) { ctx.fillStyle = '#e67e22'; ctx.fillRect(i,j,50,50); } c15.cookTimer++; if (c15.cookState === 0 && c15.cookTimer > 180) { c15.cookState = 1; c15.cookTimer = 0; } else if (c15.cookState === 1 && c15.cookTimer > 40) { c15.cookState = 2; c15.cookTimer = 0; } else if (c15.cookState === 2 && c15.cookTimer > 120) { c15.cookState = 0; c15.cookTimer = 0; } ctx.fillStyle = '#fff'; if (c15.cookState === 0) { ctx.fillRect(380, 20, 40, 60); ctx.fillStyle = '#27ae60'; ctx.fillText("COOKING...", 370, 100); } else if (c15.cookState === 1) { ctx.fillRect(380, 20, 40, 60); ctx.fillStyle = 'yellow'; ctx.fillText("TURNING...", 370, 100); } else { ctx.fillRect(380, 20, 40, 60); ctx.fillStyle = '#ecf0f1'; ctx.fillRect(380, 5, 40, 30); ctx.fillStyle = '#e74c3c'; ctx.fillRect(385, 25, 10, 5); ctx.fillRect(405, 25, 10, 5); ctx.fillText("LOOKING!", 370, 100); } ctx.fillStyle = '#8e44ad'; let tables = [{x:100,y:150}, {x:300,y:150}, {x:500,y:150}, {x:100,y:300}, {x:300,y:300}, {x:500,y:300}]; tables.forEach(t => ctx.fillRect(t.x, t.y, 100, 60)); c15.eggLocs.forEach(e => { if(!e.taken) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(e.x, e.y, 8, 10, 0, 0, Math.PI*2); ctx.fill(); }}); 
        
        let speed = 4; let moving = false;

        c15.y = Math.max(120, Math.min(410, c15.y)); c15.x = Math.max(20, Math.min(780, c15.x)); 
        
        let frame = moving ? Math.floor(Date.now()/50) : 0;
        drawToma(c15.x, c15.y, 1, frame); 
        c15.eggLocs.forEach(e => { if(!e.taken && Math.abs(c15.x - e.x) < 20 && Math.abs(c15.y - e.y) < 20) { e.taken = true; c15.eggsCollected++; score += 500; }}); if (c15.cookState === 2 && moving) { currentQuote = getQuote(); c15.bustedTimer = 120; score -= 200; } if (c15.eggsCollected >= 5) { currentState = STATE.CH4_WIN; }
    }

    // 5. PARMA
    function playParma() {
        chapEl.innerText = "CH 5: PARMA";
        if (c2.bustedTimer > 0) { ctx.fillStyle = 'rgba(192, 57, 43, 1.0)'; ctx.fillRect(0,0,800,450); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 50px Courier New'; ctx.fillText("BUSTED!", 400, 150); ctx.fillStyle = 'yellow'; ctx.font = 'italic 25px Courier New'; ctx.fillText('"' + currentQuote + '"', 400, 200); ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 20px Courier New'; ctx.fillText("NOISE LEVEL CRITICAL", 400, 250); ctx.fillStyle = '#fff'; ctx.fillText("REP LOST: -100", 400, 290); c2.bustedTimer--; if(c2.bustedTimer <= 0) {

        let safe = Math.abs(c2.guardX - 550) > 180; if (keys['Space']) { c2.isSawing = true; c2.sawProgress += 0.15; c2.noise += 0.9; score += 1; c2.pasteDelay = 60; ctx.fillStyle = 'yellow'; ctx.fillRect(655 + Math.random()*10, 220, 3, 3); } else { c2.isSawing = false; if(c2.pasteDelay > 0) { c2.pasteDelay--; c2.noise -= 0.05; } else { c2.noise -= 0.6; } }

        ctx.fillStyle = '#fff'; ctx.fillText("DANGER:", 20, 60); ctx.fillStyle = c2.noise > 50 ? 'red' : 'yellow'; ctx.fillRect(130, 45, c2.noise * 2, 15);
        if (c2.sawProgress >= 100) { score += 1000; currentState = STATE.CH5_WIN; }
    }

        }
        c3.roadOffset = (c3.roadOffset + c3.speed) % 60; ctx.fillStyle = '#555'; ctx.fillRect(0, 0, 800, 450); ctx.fillStyle = '#fff'; for(let i= -60; i<860; i+=60) { ctx.fillRect(i - c3.roadOffset, 150, 40, 5); ctx.fillRect(i - c3.roadOffset, 300, 40, 5); } if (keys['ArrowUp']) c3.carY -= 5; if (keys['ArrowDown']) c3.carY += 5; c3.carY = Math.max(10, Math.min(410, c3.carY)); ctx.fillStyle = '#3498db'; ctx.fillRect(100, c3.carY, 60, 30); ctx.fillStyle = '#2980b9'; ctx.fillRect(115, c3.carY+2, 30, 26); if (Math.random() < 0.04) c3.obstacles.push({ x: 900, y: Math.random() * 400 }); for (let i=0; i<c3.obstacles.length; i++) { let obs = c3.obstacles[i]; obs.x -= (c3.speed + 4); ctx.fillStyle = '#2c3e50'; ctx.fillRect(obs.x, obs.y, 60, 30); ctx.fillStyle = (Date.now() % 200 < 100) ? 'red' : 'blue'; ctx.fillRect(obs.x+20, obs.y+10, 10, 10); if (100 < obs.x + 60 && 160 > obs.x && c3.carY < obs.y + 30 && c3.carY + 30 > obs.y) { c3.crashed = true; c3.crashTimer = 180; currentQuote = getQuote(); } } score += 1; c3.distance += 1; ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.font = '20px Courier New'; ctx.fillText("BORDER: " + (2000 - c3.distance), 20, 30); if (c3.distance > 2000) { score += 2000; currentState = STATE.CH6_HISTORY; }

    // 7. OPERA
    function playOpera() {
        chapEl.innerText = "CH 7: LASER DESCENT";
        if (c4.bustedTimer > 0) {
            ctx.fillStyle = 'rgba(192, 57, 43, 1.0)'; ctx.fillRect(0,0,800,450);
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 40px Courier New';

        if (c4.descent % 300 === 0) { c4.lasers.push({ y: 500, active: true, timer: 0 }); }
        for(let i=c4.lasers.length-1; i>=0; i--) {
            let l = c4.lasers[i]; l.y -= speed; l.timer++; if (l.timer > 100) { l.active = !l.active; l.timer = 0; }
